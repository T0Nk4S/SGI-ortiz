{% extends "shared/base.html" %}

{% block title %}Reponer Stock{% endblock %}

{% block content %}
    <div class="page-header">
        <h1>📦 Reponer Stock</h1>
        <a href="{{ url_for('inicio.index') }}" class="btn btn-secondary">Volver a Inicio</a>
    </div>

    <form method="post" class="card" style="max-width:420px;">
        <fieldset>
            <legend>{{ producto.nombre }}</legend>
            <p class="subtitle" style="margin-top:-4px;">Código: {{ producto.codigo_1 }}</p>

            <div class="form-group">
                <label>Stock actual</label>
                <input type="text" value="{{ producto.cantidad }}" disabled>
            </div>

            <div class="form-group">
                <label>Nueva cantidad total *</label>
                <input type="number" step="0.01" name="cantidad" required value="{{ producto.cantidad }}" autofocus>
            </div>

            <button type="submit" class="btn btn-success btn-block">Guardar reposición</button>
        </fieldset>
    </form>
{% endblock %}
