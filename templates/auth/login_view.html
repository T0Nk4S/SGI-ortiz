<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - El Comercio Ortiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">🧸</div>
            <h1 class="login-title">El Comercio Ortiz</h1>
            <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" autocomplete="off">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="usuario" required autofocus autocomplete="username" value="{{ usuario or '' }}">
                </div>
                <div class="form-group">
                    <label>Contrasena</label>
                    <input type="password" name="contrasena" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary login-btn">Ingresar</button>
            </form>
        </div>
    </div>

</body>
</html>
